name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the standalone server
        env:
          APP_SECRET_PIN: ci-pin
          APP_SESSION_SECRET: ci-secret
          DATA_DIR: ${{ runner.temp }}/seyyahname-data
          PORT: 3100
        run: |
          npm start & echo $! > server.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/api/auth >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3100/api/auth | grep -q '"authenticated":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/state)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)" = 307
          kill "$(cat server.pid)"
